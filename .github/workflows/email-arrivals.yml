name: Daily Arrivals Email Import

# Pulls Bobby's morning Excel sheet from the Gmail relay inbox and writes the
# arrivals into Firestore. Runs on a schedule, and can be run manually.

on:
  schedule:
    # Bobby emails Mon-Fri, roughly 5am-7am Pacific.
    # GitHub cron is ALWAYS UTC and does not follow daylight saving, so we poll a
    # window wide enough to cover Pacific in both PST (UTC-8) and PDT (UTC-7):
    #   12:00 UTC = 4am PST / 5am PDT      17:30 UTC = 9:30am PST / 10:30am PDT
    # Every 30 min, weekdays only (1-5 = Mon-Fri). Extra polls are free: the job
    # exits immediately once that morning's email has already been imported.
    - cron: "0,30 12-17 * * 1-5"
  workflow_dispatch:
    # lets you trigger it by hand from the Actions tab
    inputs:
      dry_run:
        description: "Parse & validate only, do not write to Firestore"
        required: false
        default: "false"
      force:
        description: "Re-import even if this email was already imported"
        required: false
        default: "false"

# Only one run at a time; don't stack up if a run is slow.
concurrency:
  group: arrivals-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openpyxl google-cloud-firestore

      - name: Import arrivals from email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EXPECTED_SENDER: ${{ secrets.EXPECTED_SENDER }}
          EXPECTED_SUBJECT: "Arrivals sheet"
          FILENAME_MUST_CONTAIN: "Equipment Received"
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
          MAX_AGE_HOURS: "26"
          SOFT_IF_MISSING: "1"
          FORCE: ${{ (github.event.inputs.force == 'true') && '1' || '0' }}
          DRY_RUN: ${{ (github.event.inputs.dry_run == 'true') && '1' || '0' }}
        run: python email_import.py

      - name: Flag failure as an issue
        # Only real problems reach here — "no email yet" exits cleanly, so a quiet
        # early poll never opens an issue. Reuses one issue per day so a repeated
        # failure across the morning's polls doesn't spam you.
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const day = new Date().toISOString().slice(0,10);
            const title = `Arrivals email import failed — ${day}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "import-failure",
            });
            if (existing.data.some(i => i.title === title)) {
              core.info("An issue for today already exists — not opening another.");
              return;
            }
            const body = [
              "The arrivals email import hit a real error (not just 'no email yet').",
              "",
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "Common causes:",
              "- The attachment wasn't the Equipment Received master sheet",
              "- A column header in the sheet changed",
              "- Gmail or Firebase credentials stopped working",
              "",
              "No data was written (the importer aborts on anything unexpected).",
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["import-failure"],
            });
