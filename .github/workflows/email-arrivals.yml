name: Daily Arrivals & Tools Email Import

# Pulls Bobby's morning emails from the Gmail relay inbox:
#   - "Equipment Received & Rentals MASTER" workbook  -> arrivals + rentals
#   - "Webduct Tool Rental" PDF                        -> toolRentals + stored PDF
# They arrive in separate emails and are imported independently.

on:
  # INSTANT PATH. The relay flow can POST to
  #   https://api.github.com/repos/Arctic-Mech/Equipment-Received/dispatches
  #   {"event_type": "arrivals-email"}
  # right after it sends, and the import starts within seconds. Nothing below depends on
  # this being wired up; the cron keeps working on its own either way.
  repository_dispatch:
    types: [arrivals-email]

  schedule:
    # Bobby emails Mon-Fri, roughly 5am-7am Pacific.
    # GitHub cron is ALWAYS UTC and ignores daylight saving, so the window is sized to
    # cover Pacific in BOTH PST (UTC-8) and PDT (UTC-7).
    #
    # Every 5 minutes, 12:00-18:59 UTC = 4am-noon Pacific year-round. This used to be a
    # 10-minute "hot window" plus a half-hourly safety net, kept narrow because each run
    # was expensive. A run is seconds now, and the repo is public (free Actions minutes),
    # so there's no reason to be stingy. Note GitHub throttles scheduled workflows under
    # load - on 2026-07-29 the whole 12:00-15:00 window produced ONE run - which is why
    # the repository_dispatch above is the only route to genuinely prompt imports.
    - cron: "*/5 12-18 * * 1-5"

  workflow_dispatch:
    # lets you trigger it by hand from the Actions tab
    inputs:
      dry_run:
        description: "Parse & validate only, do not write to Firestore"
        required: false
        default: "false"
      force:
        description: "Re-import even if this email was already imported"
        required: false
        default: "false"

# Only one run at a time; don't stack up if a run is slow.
concurrency:
  group: arrivals-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    # A healthy run is seconds. This is a backstop, not headroom - keeping it tight means a
    # hang is reported in five minutes instead of ten.
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openpyxl pdfplumber google-cloud-firestore

      - name: Import arrivals, rentals & tools from email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EXPECTED_SENDER: ${{ secrets.EXPECTED_SENDER }}
          EXPECTED_SUBJECT: "Arrivals sheet"
          FILENAME_MUST_CONTAIN: "Equipment Received"
          PDF_FILENAME_MUST_CONTAIN: "Tool Rental"
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
          MAX_AGE_HOURS: "26"
          SOFT_IF_MISSING: "1"
          FORCE: ${{ (github.event.inputs.force == 'true') && '1' || '0' }}
          DRY_RUN: ${{ (github.event.inputs.dry_run == 'true') && '1' || '0' }}
        # -u because stdout to a pipe is block-buffered: when the 2026-07-29 run was killed
        # at the timeout, every line it had printed died unflushed in the buffer and the log
        # showed NOTHING about how far it got. Unbuffered, a killed run still explains itself.
        run: python -u email_import.py

      - name: Flag failure as an issue
        # Only real problems reach here — "no email yet" exits cleanly, so a quiet
        # early poll never opens an issue. Reuses one issue per day so a repeated
        # failure across the morning's polls doesn't spam you.
        #
        # cancelled() matters as much as failure(): a job killed by timeout-minutes is
        # reported as CANCELLED, not failed. With `if: failure()` alone this step was
        # skipped, which is how the import stayed dead from 2026-07-28 evening through the
        # next morning without opening an issue or sending a single notification.
        if: failure() || cancelled()
        uses: actions/github-script@v7
        with:
          script: |
            const day = new Date().toISOString().slice(0,10);
            const title = `Arrivals email import failed — ${day}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "import-failure",
            });
            if (existing.data.some(i => i.title === title)) {
              core.info("An issue for today already exists — not opening another.");
              return;
            }
            const body = [
              "The arrivals email import hit a real error (not just 'no email yet'), or was",
              "killed by the job timeout.",
              "",
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "Common causes:",
              "- The attachment wasn't the Equipment Received master sheet",
              "- A column header in the sheet changed",
              "- Gmail or Firebase credentials stopped working",
              "- Timed out: check the log for the IMAP search / matched / opened counts.",
              "  A large search count means the relay inbox is holding far more mail than",
              "  expected — clear it, or raise MAX_BODIES.",
              "",
              "No data was written (the importer aborts on anything unexpected).",
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["import-failure"],
            });
