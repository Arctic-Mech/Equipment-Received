name: Daily Arrivals Email Import

# Pulls Bobby's morning Excel sheet from the Gmail relay inbox and writes the
# arrivals into Firestore. Runs on a schedule, and can be run manually.

on:
  schedule:
    # 06:30 America/Los_Angeles. GitHub cron is UTC, so this is 13:30 UTC.
    # (During Pacific Daylight Time that's 6:30am; in standard time it's 5:30am.
    #  Adjust the number if you want a fixed local clock time year-round.)
    - cron: "30 13 * * *"
  workflow_dispatch:
    # lets you trigger it by hand from the Actions tab, with an optional dry run
    inputs:
      dry_run:
        description: "Parse & validate only, do not write to Firestore"
        required: false
        default: "false"

# Only one run at a time; don't stack up if a run is slow.
concurrency:
  group: arrivals-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openpyxl google-cloud-firestore

      - name: Import arrivals from email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EXPECTED_SENDER: ${{ secrets.EXPECTED_SENDER }}
          EXPECTED_SUBJECT: "Arrivals sheet"
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
          MAX_AGE_HOURS: "26"
          DRY_RUN: ${{ (github.event.inputs.dry_run == 'true') && '1' || '0' }}
        run: python email_import.py

      - name: Flag failure as an issue
        # If the import step failed (bad sheet, no email, etc.), open an issue so
        # you find out instead of silently missing a day.
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Arrivals email import failed — ${new Date().toISOString().slice(0,10)}`;
            const body = [
              "The scheduled arrivals email import did not complete.",
              "",
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "Common causes:",
              "- Bobby's email hadn't arrived yet when the job ran",
              "- The attachment wasn't an .xlsx/.xlsm file",
              "- A column header in the sheet changed",
              "",
              "No data was written (the importer aborts on anything unexpected).",
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["import-failure"],
            });
